<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Catatan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>Aplikasi Catatan</h1>
    </div>
  </header>

  <main>
    <!-- Form Tambah / Edit Catatan -->
    <section class="form-section">
      <h2 id="form-title">Tambah Catatan Baru</h2>
      <div class="form-card">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label for="judul">Judul</label>
          <input type="text" id="judul" placeholder="Masukkan judul catatan..." />
        </div>
        <div class="form-group">
          <label for="isi">Isi Catatan</label>
          <textarea id="isi" rows="5" placeholder="Tulis isi catatan di sini..."></textarea>
        </div>
        <div class="form-actions">
          <button id="btn-simpan" onclick="simpanCatatan()">Simpan</button>
          <button id="btn-batal" class="btn-secondary hidden" onclick="batalEdit()">✕ Batal</button>
        </div>
      </div>
    </section>

    <!-- Daftar Catatan -->
    <section class="list-section">
      <div class="list-header">
        <h2>Daftar Catatan</h2>
        <span id="jumlah-catatan" class="badge">0 catatan</span>
      </div>

      <div id="alert" class="alert hidden"></div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Memuat catatan...</p>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p>Belum ada catatan. Buat catatan pertamamu!</p>
      </div>

      <div id="daftar-catatan" class="notes-grid"></div>
    </section>
  </main>

  <!-- Modal Konfirmasi Hapus -->
  <div id="modal-hapus" class="modal-overlay hidden">
    <div class="modal">
      <h3>Hapus Catatan?</h3>
      <p>Catatan ini akan dihapus permanen dan tidak bisa dikembalikan.</p>
      <div class="modal-actions">
        <button class="btn-danger" onclick="konfirmasiHapus()">Ya, Hapus</button>
        <button class="btn-secondary" onclick="tutupModal()">Batal</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
