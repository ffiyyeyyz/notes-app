server {
    listen 880;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # SPA fallback 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \. (js|css|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-control "public, immutable";
    }
}